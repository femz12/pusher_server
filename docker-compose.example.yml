# Two socketelx nodes sharing one Redis, behind an nginx load balancer.
# Point your backend (host / port) and your browser client at the `lb`
# service. For a single node you can drop everything except one `socketelx-1`
# without SOCKETELX_REDIS_URL — Redis is only needed with more than one node.
#
#   docker compose -f docker-compose.example.yml up --build

services:
  redis:
    image: redis:7-alpine
    # socketelx only keeps ephemeral state in Redis (who is subscribed
    # right now). If Redis restarts empty, the running nodes write their state
    # back within ~10s, so nothing needs to be persisted.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  socketelx-1: &socketelx
    build: .
    # or, once you publish the image: ghcr.io/socketelx/socketelx:latest
    environment:
      SOCKETELX_APP_ID: app-id
      SOCKETELX_APP_KEY: app-key
      SOCKETELX_APP_SECRET: app-secret
      SOCKETELX_REDIS_URL: redis://redis:6379
      PORT: "6001"
    depends_on:
      redis:
        condition: service_healthy
    # A little longer than the 1s drain window so `docker stop` can tell
    # connected clients to reconnect before the container is killed.
    stop_grace_period: 10s

  socketelx-2:
    <<: *socketelx

  lb:
    image: nginx:1.27-alpine
    ports:
      - "6001:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - socketelx-1
      - socketelx-2

  # Your own backend (any language), pointed at the load balancer:
  #
  # app:
  #   build: ../your-backend
  #   # use host `lb` and port 80 for the realtime server, and the same
  #   # app id, key and secret as above
  #   depends_on:
  #     - lb
