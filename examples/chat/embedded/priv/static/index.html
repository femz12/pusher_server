<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple chat</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --line:#2a2e37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display:grid; grid-template-columns: 1fr 180px; gap:12px; }
  @media (max-width: 600px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  h1 { font-size: 18px; margin: 0 0 8px; grid-column: 1 / -1; }
  #log { height: 55vh; overflow-y: auto; display:flex; flex-direction:column; gap:6px; }
  .msg b { color: var(--accent); }
  .sys { color: var(--muted); font-size: 14px; }
  #typing { height: 20px; color: var(--muted); font-size: 14px; }
  form { display:flex; gap:8px; margin-top:8px; }
  input { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  ul { list-style:none; margin:0; padding:0; } li { padding:2px 0; }
  #status { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Simple chat</h1>
  <div id="status">Not connected</div>
  <section class="card">
    <div id="log"></div>
    <div id="typing"></div>
    <form id="send"><input id="text" placeholder="Type a message" autocomplete="off" disabled><button disabled>Send</button></form>
  </section>
  <aside class="card"><strong>Online</strong><ul id="online"></ul></aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/pusher-js@8.2.0/dist/web/pusher.min.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const username = (prompt('Pick a name') || '').trim().slice(0, 32) || 'guest-' + Math.floor(Math.random() * 1000);
  const cfg = await (await fetch('/config.json')).json();

  // 1. Connect to the Pusher-protocol server (this is the only Pusher-specific setup).
  const pusher = new Pusher(cfg.key, {
    cluster: 'unused',               // pusher-js requires it; the server ignores it
    wsHost: cfg.wsHost,
    wsPort: cfg.wsPort,
    wssPort: cfg.wsPort,
    forceTLS: cfg.forceTLS,
    enabledTransports: ['ws', 'wss'],
    disableStats: true,
    // 2. Presence channels need your backend to say who is allowed in.
    channelAuthorization: { endpoint: '/pusher/auth', params: { username } },
  });

  pusher.connection.bind('state_change', (s) => { $('status').textContent = 'Connection: ' + s.current; });

  // 3. Join the room.
  const channel = pusher.subscribe('presence-chat');

  const online = new Map();
  const renderOnline = () => {
    $('online').replaceChildren(...[...online.values()].map((n) => Object.assign(document.createElement('li'), { textContent: n })));
  };
  const line = (cls, build) => {
    const div = document.createElement('div');
    div.className = cls;
    build(div);
    $('log').append(div);
    $('log').scrollTop = $('log').scrollHeight;
  };

  channel.bind('pusher:subscription_succeeded', (members) => {
    members.each((m) => online.set(m.id, m.info.name));
    renderOnline();
    $('text').disabled = false; document.querySelector('button').disabled = false;
    line('sys', (d) => { d.textContent = 'You joined as ' + username; });
  });
  channel.bind('pusher:member_added', (m) => { online.set(m.id, m.info.name); renderOnline(); line('sys', (d) => { d.textContent = m.info.name + ' joined'; }); });
  channel.bind('pusher:member_removed', (m) => { online.delete(m.id); renderOnline(); line('sys', (d) => { d.textContent = m.info.name + ' left'; }); });

  // 4. Messages arrive as events sent by your backend.
  channel.bind('message', (m) => {
    line('msg', (d) => { const b = document.createElement('b'); b.textContent = m.user + ': '; d.append(b, document.createTextNode(m.text)); });
  });

  // 5. "Typing…" uses client events: browser to browser, no backend involved.
  let typingTimer;
  channel.bind('client-typing', (m) => {
    $('typing').textContent = m.user + ' is typing…';
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { $('typing').textContent = ''; }, 1500);
  });
  let lastTyping = 0;
  $('text').addEventListener('input', () => {
    if (Date.now() - lastTyping > 1000) { lastTyping = Date.now(); channel.trigger('client-typing', { user: username }); }
  });

  $('send').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    $('text').value = '';
    await fetch('/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: username, text }) });
  });
})();
</script>
</body>
</html>
