# Example load balancer for several socketelx nodes.
#
# Needs no sticky sessions: a WebSocket stays on the node it connected to for
# its whole life, and REST calls from your backend (POST /apps/<id>/events) can land
# on any node because the nodes share state through Redis.
#
# For wss:// terminate TLS here (or in your cloud load balancer) and keep the
# nodes themselves on plain HTTP.

events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream socketelx_nodes {
    least_conn;
    server socketelx-1:6001;
    server socketelx-2:6001;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://socketelx_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # The server advertises a 120s activity timeout and clients ping well
      # inside it, so keep idle sockets open comfortably longer than that.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
